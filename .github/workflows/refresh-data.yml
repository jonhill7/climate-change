name: Refresh data snapshot

on:
  schedule:
    - cron: "17 6 * * 1"   # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild snapshot
        run: python scripts/update_data.py
      - name: Rebuild single-file page
        run: python scripts/build_artifact.py
      - name: Commit if changed
        run: |
          if git diff --quiet -- site/data dist; then
            echo "No data changes"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data dist
          git commit -m "Refresh climate data snapshot"
          git push
